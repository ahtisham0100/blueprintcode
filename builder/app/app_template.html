<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint Builder</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#0B1A2E;--ground-2:#0E2136;--ground-3:#122844;--line:#2C4A6E;--line-soft:#1D3552;--ink:#EAF1F8;--ink-2:#8FA9C6;
--ok:#9FE0B8;--warn:#FFD28A;--err:#FFB4A8;--info:#A9CBF0;
--display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15.5px/1.55 var(--sans)}
[hidden]{display:none!important}
a{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:10px;background:var(--ink);color:var(--ground);padding:8px 12px;z-index:9}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--ground-2);border:1px solid var(--line);border-radius:2px;padding:9px 11px}
textarea{resize:vertical;min-height:70px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:2px;cursor:pointer;background:var(--ground)}
.opt:hover{border-color:var(--ink-2)}
.opt:has(input:checked){border-color:var(--ink);background:var(--ground-3)}
.opt:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.opt input{margin:3px 0 0;accent-color:var(--ink);width:17px;height:17px;flex:none}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);cursor:pointer;line-height:1.15}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.tiny{font-size:13px;padding:6px 10px;font-weight:500}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:3px 2px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.link:hover{color:var(--ink)}
.muted{color:var(--ink-2)}.small{font-size:13.5px}
.chip{font-family:var(--mono);font-size:11.5px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;cursor:pointer;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
.kw{font-family:var(--display);letter-spacing:.06em;color:var(--ink-2);font-size:17px}
.tbl{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
thead th{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink-2);background:var(--ground-2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{border-left:3px solid var(--warn);background:var(--ground-2);padding:10px 14px;margin:12px 0}
.banner.ok{border-color:var(--ok)}
.push{margin-left:auto}

/* App shell */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line-soft)}
.mark{font-family:var(--display);font-size:26px;letter-spacing:.05em;line-height:1;text-decoration:none}
.appname{font-family:var(--display);font-size:24px;letter-spacing:.04em;color:var(--ink-2);line-height:1}
.pname{flex:1;min-width:180px;max-width:340px}
.pname input{background:transparent;border:1px solid transparent;border-bottom-color:var(--line);padding:6px 4px;font-weight:600;font-size:16.5px}
#app-saved{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.view{padding:22px 24px 64px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,4.6vw,58px);line-height:.95;letter-spacing:.02em;margin:0 0 14px}
h1:focus{outline:none}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.pmain{min-width:0;max-width:980px}
.psec{margin:0 0 30px}
.psec h2{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.04em;margin:0 0 8px;line-height:1}
.sgrid,.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.scard,.tcard{border:1px solid var(--line);background:var(--ground-2);padding:14px 16px;border-radius:2px;display:flex;flex-direction:column;gap:4px}
.scard.implied{border-style:dashed;border-color:var(--info)}
.scard h3,.tcard h3{margin:0;font-size:16.5px}
.tc-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.tcard .tc-h{justify-content:flex-start}
.tid{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.tc-cat,.tc-src,.tc-prog{margin:0}
.tc-docs{display:flex;flex-wrap:wrap;gap:4px 10px;margin:2px 0 0}
.tc-act{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.meter{height:5px;background:var(--line-soft);margin-top:6px}
.meter span{display:block;height:100%;background:var(--ink-2)}
.rn{display:flex;gap:6px;align-items:center;flex:1}
.rn input{padding:5px 8px}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.ph{font-size:13px;border:1px solid var(--line);padding:1px 8px;border-radius:2px;color:var(--ink-2)}
.conf-strong{color:var(--ok);border-color:var(--ok)}.conf-likely{color:var(--info);border-color:var(--info)}.conf-possible{color:var(--ink-2)}
.because{margin:0;padding-left:18px;font-size:14px}
.addown{display:grid;grid-template-columns:auto minmax(0,220px) minmax(0,240px) auto;gap:8px;align-items:center;margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px}
.addown .lbl{font-weight:600}
.addown .btn{justify-self:start}
.prail{display:grid;gap:14px;position:sticky;top:12px}
.pcard{border:1px solid var(--line);background:var(--ground-2);padding:14px 16px}
.pcard.next{border-color:var(--ink-2)}
.plist{margin:0;padding-left:18px;font-size:14px}
.th-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}
.th-row h1{margin:0}
.apptabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:14px 0 18px}
.apptabs a{padding:9px 14px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
.apptabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
.apptabs .cnt{font-family:var(--mono);font-size:11.5px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--line-soft)}
@media (max-width:1100px){.pgrid{grid-template-columns:1fr}.prail{position:static;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:640px){.view{padding:16px 12px 48px}.addown{grid-template-columns:1fr}.top{padding:10px 12px}}

/* Discovery */

.dshell{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:0}
.dsteps{border-right:1px solid var(--line-soft);padding:4px 12px 12px 0;position:sticky;top:12px;align-self:start}
.dsteps ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.dsteps button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:2px;cursor:pointer;color:var(--ink-2);display:grid;grid-template-columns:22px 1fr;gap:2px 8px;align-items:baseline}
.dsteps button:hover{background:var(--ground-2);color:var(--ink)}
.dsteps button[aria-current=step]{background:var(--ground-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.dsteps .l{font-family:var(--mono);font-size:12.5px}
.dsteps .st{grid-column:2;font-family:var(--mono);font-size:11.5px}
.st.confirmed{color:var(--ok)}.st.needs_review{color:var(--warn)}.st.open{color:var(--ink-2)}
.dmain{padding:4px 28px 48px;min-width:0;max-width:820px}
.dbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.dh{font-family:var(--display);font-weight:400;font-size:clamp(34px,4vw,48px);line-height:.95;letter-spacing:.02em;margin:10px 0 6px}
.dh:focus{outline:none}
.subh{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.04em;margin:26px 0 8px}
.intro{color:var(--ink-2);margin:0 0 22px;max-width:62ch}
.q{border:1px solid var(--line);background:var(--ground-2);border-radius:2px;padding:16px 18px;margin:0 0 14px}
.q legend,.q .ql{float:left;width:100%;padding:0;margin:0 0 4px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.q legend + *,.q .ql + *{clear:both}
.qid{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-weight:400}
.req{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-weight:400;margin-left:auto}
.hint{margin:0 0 10px;color:var(--ink-2);font-size:14.5px}
.other{margin-top:8px}
.qfoot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.tog{background:none;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tog[aria-pressed=true]{border-color:var(--warn);color:var(--warn)}
.tog.bpc[aria-pressed=true]{border-color:var(--info);color:var(--info)}
.affects{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-left:auto}
.rec{margin-top:10px;border-left:3px solid var(--info);background:var(--ground);padding:10px 12px}
.rec p{margin:0 0 6px}
.unk{margin-top:10px;border-left:3px solid var(--warn);background:var(--ground);padding:8px 12px;font-size:14px}
.chip.confirmed{color:var(--ok);border-color:var(--ok)}
.chip.assumption{color:var(--warn);border-color:var(--warn)}
.chip.unknown{color:var(--err);border-color:var(--err)}
.chip.bpc{color:var(--info);border-color:var(--info)}
.chip.bpc_accepted{color:var(--info);border-color:var(--info)}
.chip.missing{border-style:dashed}
.summary{border:1px solid var(--ink-2);padding:16px 18px;margin-top:22px;background:var(--ground)}
.summary h2{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.04em;margin:0 0 4px;line-height:1}
.dec{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.dec li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line-soft)}
.dec .qid{padding-top:3px}
.dec .txt{margin:0}
.dec .ed{display:flex;gap:6px}
.dec input{padding:6px 8px}
.banner{border-left:3px solid var(--warn);background:var(--ground-2);padding:10px 14px;margin:0 0 18px}
.banner.ok{border-color:var(--ok)}
.nav{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.nav .push{margin-left:auto}
.drail{border-left:1px solid var(--line-soft);padding:4px 16px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:18px}
.drail h3,.prail h2,.pcard h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;margin:0 0 8px;line-height:1}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.counts div{border:1px solid var(--line-soft);padding:6px 8px}
.counts dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.counts dd{margin:0;font-family:var(--display);font-size:26px;line-height:1.1}
.docs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.docs li{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;align-items:baseline}
.ds{font-family:var(--mono);font-size:11px;white-space:nowrap}
.ds.draft{color:var(--ink-2)}.ds.input{color:var(--err)}.ds.ready{color:var(--ok)}.ds.review{color:var(--warn)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.hist .when{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:block}
.grid-rev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{border:1px solid var(--line);background:var(--ground-2);padding:14px 16px}
.panel h3{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0 0 8px;line-height:1}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:4px 0}
@media (max-width:1180px){.dshell{grid-template-columns:200px minmax(0,1fr)}.drail{grid-column:1/-1;position:static;border-left:0;border-top:1px solid var(--line-soft);max-height:none;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:760px){.shell{grid-template-columns:1fr}.dsteps{position:static;border-right:0;border-bottom:1px solid var(--line-soft)}.dsteps ol{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.dmain{padding:4px 0 40px}.grid-rev{grid-template-columns:1fr}.dec li{grid-template-columns:1fr}.affects{margin-left:0}}

/* Rules Studio */

.badge-sample{font-family:var(--mono);font-size:12px;color:var(--warn);border:1px solid var(--warn);padding:2px 8px;border-radius:20px}
.swrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:22px;align-items:start}
.sbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sbar .sp{flex:1}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--ink-2);padding:9px 14px;cursor:pointer;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .cnt{font-family:var(--mono);font-size:12px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--line-soft)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{font-weight:600;font-size:14px;padding:9px 14px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);cursor:pointer;line-height:1.1}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.tiny{font-size:13px;padding:6px 10px;font-weight:500}
.btn.danger{border-color:#6b3a3a;color:var(--err);background:transparent}
.link{background:none;border:0;padding:4px 2px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.link:hover{color:var(--ink)}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}

/* Rule cards */
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rule{border:1px solid var(--line);background:var(--ground-2);border-radius:2px}
.rule.disabled{opacity:.62}
.rule.suggested{border-style:dashed}
.rule.open{border-color:var(--ink-2)}
.rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px 6px}
.rid{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.rname{font-weight:600;margin:0;font-size:15.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.hard{color:var(--ink);border-color:var(--ink-2)}
.chip.ai{color:var(--warn);border-color:var(--warn)}
.chip.bpc{color:var(--info);border-color:var(--info)}
.chip.off{color:var(--ink-2)}
.chip.bad{color:var(--err);border-color:var(--err)}
.sentence{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 10px;padding:4px 14px 10px}
.kw{font-family:var(--display);font-size:19px;letter-spacing:.06em;color:var(--ink-2);line-height:1.35}
.sentence p{margin:0;overflow-wrap:anywhere}
.ractions{display:flex;flex-wrap:wrap;gap:2px 12px;padding:6px 14px 10px;border-top:1px solid var(--line-soft)}
.ractions .sp{flex:1}

/* Editor */
.editor{border-top:1px solid var(--line);padding:14px;display:grid;gap:14px;background:var(--ground)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.f label,.f .lbl{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--ground-2);border:1px solid var(--line);border-radius:2px;padding:8px 10px}
textarea{resize:vertical;min-height:60px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{accent-color:var(--ink);width:17px;height:17px;margin:2px 0 0}
.block{border:1px solid var(--line-soft);padding:12px;border-radius:2px}
.block-h{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.block-h .kw{font-size:22px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
.conds{display:grid;gap:8px}
.cond{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.4fr) 32px;gap:8px;align-items:start}
.group{border-left:2px solid var(--line);padding:8px 0 8px 12px;display:grid;gap:8px}
.joiner{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.x{width:32px;height:36px;border:1px solid transparent;background:none;color:var(--ink-2);cursor:pointer;border-radius:2px;font-size:16px}
.x:hover{border-color:var(--line);color:var(--ink)}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.vals label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);padding:4px 8px;border-radius:20px;font-size:13.5px;cursor:pointer}
.vals label:has(input:checked){border-color:var(--ink);background:var(--ground-3)}
.vals input{accent-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.act{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) 32px;gap:8px;align-items:start}
.params{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.iss{border-left:3px solid var(--ink-2);padding:6px 10px;background:var(--ground-2);font-size:14px}
.iss.error{border-color:var(--err)}.iss.conflict{border-color:var(--err)}.iss.warning{border-color:var(--warn)}.iss.info{border-color:var(--info)}
.iss .lv{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-right:8px;text-transform:lowercase}
.ed-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Catalogue */
.tbl{overflow:auto;border:1px solid var(--line);max-height:460px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--ground-2);font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink-2)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:12px 0}
.fcard{border:1px solid var(--line);padding:8px 10px;background:var(--ground-2);font-size:14px}
.fcard .t{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.fcard.used{border-color:var(--ok)}.fcard.missing{border-color:var(--err);border-style:dashed}
.note-sample{border:1px solid var(--warn);color:var(--warn);padding:8px 12px;font-size:14px;margin-bottom:12px}

/* Test bench */
.bench{position:sticky;top:12px;border:1px solid var(--line);background:var(--ground-2);max-height:calc(100vh - 24px);overflow:auto}
.bench-h{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.bench-h h3{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.04em;margin:0;line-height:1}
.bench-in{padding:14px 16px;display:grid;gap:10px}
.ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.samples{display:flex;flex-wrap:wrap;gap:6px}
.samples button{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:20px;padding:3px 10px;font-size:13px;cursor:pointer;text-align:left}
.samples button:hover{color:var(--ink);border-color:var(--ink-2)}
.out{padding:0 16px 18px;display:grid;gap:14px}
.out h3{margin:0 0 6px;font-size:14px;font-family:var(--mono);font-weight:400;color:var(--ink-2)}
.interp{display:flex;flex-wrap:wrap;gap:6px}
.ic{border:1px solid var(--ink-2);border-radius:2px;padding:3px 8px;font-size:13.5px}
.ic.neg{border-color:var(--err);color:var(--err)}
.flag{padding:8px 10px;font-size:14px;border-left:3px solid var(--warn);background:var(--ground)}
.flag.err{border-color:var(--err)}.flag.ok{border-color:var(--ok)}
.cov{border:1px solid var(--line-soft)}
.cov td,.cov th{white-space:normal}
.cov tr.gap td{color:var(--warn)}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ri{border:1px solid var(--line-soft);background:var(--ground);padding:10px 12px}
.ri-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ri-n{font-weight:600}
.ri-p{font-family:var(--mono);white-space:nowrap}
.ri-p s{color:var(--ink-2);margin-right:6px}
.ri-a{font-size:13px;color:var(--ink-2)}
.ri-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ri-m{margin:4px 0 0;font-size:13.5px}
details{font-size:13.5px}
summary{cursor:pointer;color:var(--ink-2)}
.trace{margin:6px 0 0;padding-left:18px}
.ex{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.ex li{font-size:13.5px}
@media (max-width:1100px){.swrap{grid-template-columns:1fr}.bench{position:static;max-height:none}}
@media (max-width:640px){.grid4{grid-template-columns:1fr 1fr}.cond{grid-template-columns:1fr 32px}.cond>*:nth-child(3){grid-column:1}.act{grid-template-columns:1fr 32px}.act .params{grid-column:1}.sentence{grid-template-columns:1fr}}


/* Connecting tools */
.cx .apptabs{flex-wrap:wrap}
.apptabs button{background:none;border:0;padding:9px 14px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500;cursor:pointer}
.apptabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.cxiss{margin:12px 0 0}.cxiss summary{cursor:pointer;color:var(--warn)}
.cxj{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;align-items:start}
.cxcanvas{overflow:auto;border:1px solid var(--line);background-color:var(--ground);background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:20px 20px;max-height:640px}
.cxcanvas svg{display:block}
.cxcanvas .node{cursor:grab}.cxcanvas.ro .node{cursor:default}
.cxcanvas .node rect{fill:var(--ground-2);stroke:var(--line);stroke-width:1.5}
.cxcanvas .node.entry rect{stroke:var(--ink-2);stroke-width:2}
.cxcanvas .node:focus{outline:none}.cxcanvas .node:focus rect{stroke:var(--ink);stroke-width:3}
.cxcanvas .nid{font:500 11px var(--mono);fill:var(--ink-2)}
.cxcanvas .nname{font:600 14px var(--sans);fill:var(--ink)}
.cxcanvas .neff{font:500 10.5px var(--mono);fill:var(--warn)}
.cxcanvas .eff-origin rect{fill:var(--ground-3);stroke:var(--ink);stroke-width:2.5}
.cxcanvas .eff-recalculate rect,.cxcanvas .eff-update rect{stroke:var(--warn);stroke-width:2.5}
.cxcanvas .eff-clear rect{stroke:var(--err);stroke-width:2.5}.cxcanvas .eff-clear .neff{fill:var(--err)}
.cxcanvas .eff-flag rect{stroke:var(--info);stroke-width:2.5}.cxcanvas .eff-flag .neff{fill:var(--info)}
.cxcanvas .eff-keep rect{stroke:var(--ok);stroke-width:2.5}.cxcanvas .eff-keep .neff{fill:var(--ok)}
.cxcanvas .lnk path{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.cxcanvas marker path{fill:var(--ink-2)}
.cxcanvas .lnk.sel path,.cxcanvas .lnk.hot path{stroke:var(--ink);stroke-width:2.5}
.cxcanvas .lnk.hot path{stroke:var(--warn)}
.cxcanvas .lbl{cursor:pointer}
.cxcanvas .lbl rect{fill:var(--ground);stroke:var(--line)}
.cxcanvas .lnk.sel .lbl rect{stroke:var(--ink)}
.cxcanvas .lbl:focus{outline:none}.cxcanvas .lbl:focus rect{stroke:var(--ink);stroke-width:2}
.cxcanvas .lbl text{font:11px var(--mono);fill:var(--ink)}
.cxside{display:grid;gap:14px;min-width:0}
.cxside .vals label,.lcedit .vals label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);padding:4px 9px;border-radius:20px;font-size:13.5px;cursor:pointer;margin:0 6px 6px 0}
.cxside .vals label:has(input:checked){border-color:var(--ink);background:var(--ground-3)}
.vals input{accent-color:var(--ink)}
.addlink{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:12px}
.addlink select{width:auto;max-width:170px}
.addlink .lbl,.f legend,.f>label{font-weight:600;font-size:14px}
.f{border:0;margin:0 0 10px;padding:0;min-width:0}
.f>label,.f>legend{display:block;margin-bottom:4px;padding:0}
.opt-tag{font-weight:400;color:var(--ink-2)}
.lcards{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lcard{border:1px solid var(--line);background:var(--ground-2);padding:10px 12px}
.lcard.sel{border-color:var(--ink-2)}
.lc-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:600;font-size:14.5px}
.lcedit{border-top:1px solid var(--line-soft);margin-top:8px;padding-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.newf{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;margin-top:4px}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px;margin:0 0 10px}
.check input{accent-color:var(--ink);width:17px;height:17px;margin:2px 0 0;flex:none}
.x{width:32px;height:34px;border:1px solid transparent;background:none;color:var(--ink-2);cursor:pointer;border-radius:2px;font-size:15px}
.x:hover{border-color:var(--line);color:var(--ink)}
.steps-list{margin:12px 0 16px;padding-left:22px;display:grid;gap:6px}
.docbody{max-width:980px}
.docbody p{max-width:75ch}
.ds{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.ds.draft{color:var(--ink-2)}.ds.input{color:var(--err)}.ds.ready{color:var(--ok)}.ds.review{color:var(--warn)}
@media (max-width:1100px){.cxj{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.newf{grid-template-columns:1fr}}
.signals{margin-top:16px;border-left:3px solid var(--info);background:var(--ground-2);padding:12px 16px}
.signals h3{margin:0 0 4px;font-size:16px}
.signals ul{margin:0;padding-left:18px;display:grid;gap:8px}

/* Blueprint documents */
.topnav{display:flex;gap:14px}.topnav a{color:var(--ink-2);text-decoration:none;font-weight:500}.topnav a:hover{color:var(--ink)}
.crumb{margin:0 0 6px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.lead{color:var(--ink-2);max-width:78ch;margin:0 0 10px}
.rv{margin:6px 0 14px}
.bpgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.bpmain{display:grid;gap:18px;min-width:0}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);background:var(--ground-2);padding:14px 16px}
.stat p{margin:0}.stat-k{font-family:var(--mono);font-size:12px;color:var(--ink-2)}.stat-v{font-weight:600;font-size:16.5px;margin-top:4px!important}.stat-s{color:var(--ink-2);font-size:14px}
.panel{border:1px solid var(--line);background:var(--ground-2);padding:16px 18px}
.panel h2{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em;margin:0 0 8px;line-height:1}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pill{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);padding:2px 8px;border-radius:20px;color:var(--ink-2)}
.panel h3.grp-h{font:400 13px var(--mono);letter-spacing:0;color:var(--ink-2);margin:16px 0 6px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.dcard{display:flex;flex-direction:column;gap:3px;text-decoration:none;border:1px solid var(--line);background:var(--ground);padding:10px 12px;min-height:92px}
.dcard:hover{border-color:var(--ink-2)}
.dcard .st-chip{align-self:flex-start;margin-bottom:4px}
.dcard-id{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-right:6px}
.dcard-t{font-weight:600;font-size:14.5px;line-height:1.3}.dcard-s{color:var(--warn);font-size:13px}
.st-chip{font-family:var(--mono);font-size:11.5px;padding:1px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.st-draft{color:var(--ink-2)}.st-input{color:var(--err)}.st-ready{color:var(--info)}.st-review{color:var(--warn)}
.st-client_approved{color:var(--ok)}.st-bpc_review{color:var(--warn)}.st-bpc_approved{color:var(--ok);background:rgba(159,224,184,.12)}
.sgrid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.scard2{border:1px solid var(--line);background:var(--ground-2);padding:14px 16px}
.scard2 h3{margin:0 0 8px;font-size:15.5px}.scard2 ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}.scard2 li{margin:3px 0}
.golive{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.golive li{border:1px solid var(--line);border-left:3px solid var(--ok);background:var(--ground);padding:9px 12px;display:grid;gap:2px}
.bprail{display:grid;gap:14px;position:sticky;top:12px}
.health{margin:0 0 12px;display:grid;gap:6px}.health div{display:flex;justify-content:space-between;gap:10px;font-size:14px}.health dt{color:var(--ink-2)}.health dd{margin:0;font-weight:600;text-align:right}
.stages{margin:0;padding-left:20px;display:grid;gap:8px}.stages strong{display:block}.stages span{color:var(--ink-2);font-size:13.5px}
.docwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}
.docnav{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border-right:1px solid var(--line-soft);padding-right:12px}
.docnav a{display:flex;gap:8px;align-items:center;padding:5px 8px;color:var(--ink-2);text-decoration:none;font-size:14px;border-radius:2px}
.docnav a:hover{color:var(--ink);background:var(--ground-2)}
.docnav a[aria-current=page]{color:var(--ink);background:var(--ground-2);box-shadow:inset 3px 0 0 var(--ink)}
.docnav .nav-sec{margin:14px 8px 4px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-2)}
.dot-input{background:var(--err)}.dot-ready{background:var(--info)}.dot-review,.dot-bpc_review{background:var(--warn)}.dot-client_approved,.dot-bpc_approved{background:var(--ok)}
.docmain{min-width:0;max-width:1040px}
.docact{margin:4px 0 6px}
.docbody p,.docbody li{max-width:78ch}
.idc{white-space:nowrap}
.cbtn{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:12px;cursor:pointer;padding:2px 0;display:block}
.cbtn:hover{color:var(--ink)}
.thread td{background:var(--ground)}
.thr ul{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px;font-size:14px}
.when{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:block}
.diffp{border:1px solid var(--warn);padding:14px 16px;margin:12px 0}
.diffp h2{font-size:17px;margin:0 0 4px}
.diff{font-family:var(--mono);font-size:12.5px;max-height:360px;overflow:auto;border:1px solid var(--line-soft)}
.dl{padding:3px 10px;white-space:pre-wrap}
.dl.add{background:rgba(159,224,184,.12);border-left:3px solid var(--ok)}
.dl.del{background:rgba(255,180,168,.1);border-left:3px solid var(--err);color:var(--ink-2)}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line-soft)}
@media (max-width:1180px){.bpgrid{grid-template-columns:1fr}.bprail{position:static;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.stats4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.docwrap{grid-template-columns:1fr}.docnav{position:static;max-height:260px;border-right:0;border-bottom:1px solid var(--line-soft);padding-bottom:10px}}
@media (max-width:560px){.stats4{grid-template-columns:1fr}}
@media print{
  :root{--ground:#fff;--ground-2:#fff;--ground-3:#f2f2f2;--ink:#111;--ink-2:#444;--line:#999;--line-soft:#ccc}

  .top,.docnav,.docact,.rv,.pager,.cbtn,.skip,.diffp .muted,.small a{display:none!important}

}
.unmatched{margin-top:12px;border-left:3px solid var(--warn);background:var(--ground-2);padding:12px 16px}
/* account, sync and sending */
.acct-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.acct-form label{flex-basis:100%;font-weight:600}
.acct-form input{flex:1;min-width:220px;width:auto;background:var(--ground-2);border:1px solid var(--line);border-radius:2px;padding:9px 11px}
.acct-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}

.rv{margin:0 0 10px}
@media (max-width:640px){.app-banner{margin:12px 12px 0}}
.unmatched h3{margin:0 0 4px;font-size:16px}
.unmatched ul{margin:0;padding-left:18px}
</style>
